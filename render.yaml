# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION — MATOSHREE CLINIC EMR
# Clinic: Matoshree Clinic | Latur, Maharashtra, India
# Doctors: Dr. Vinod Korale & Dr. Vaishali Korale
# Database: Neon Serverless PostgreSQL
# ==============================================================================

services:
  - type: web
    name: matoshree-clinic-emr
    runtime: node
    plan: free
    region: singapore # Closest low-latency region to India
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/settings
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: NEXT_PUBLIC_CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL connection string here in Render Dashboard
      - key: SESSION_SECRET
        generateValue: true # Render generates a secure random 32-character secret key
      - key: SESSION_EXPIRY_HOURS
        value: "12"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
